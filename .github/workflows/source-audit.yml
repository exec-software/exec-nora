name: Source security audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 256MiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the audit boundary
        run: python3 scripts/test_audit_secrets.py
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/source-scanner"
          cd "$RUNNER_TEMP/source-scanner"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output scanner.tar.gz
          printf '%s  scanner.tar.gz\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb | sha256sum --check -
          tar -xzf scanner.tar.gz gitleaks
      - name: Scan source snapshot and fetched history
        shell: bash
        run: |
          python3 scripts/audit_secrets.py \
            --scanner "$RUNNER_TEMP/source-scanner/gitleaks" \
            --report-dir "$RUNNER_TEMP/source-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      # Do not upload scan reports: even redacted findings can expose private
      # filenames, commit messages, topology, or surrounding source context.
